# 프론트 정적 서빙 + /api·/ws 를 BFF 컨테이너로 리버스 프록시(단일 오리진).
# 'stock' 도커 네트워크 안에서 컨테이너명 'stock-bff' 로 4000 포트에 붙는다.

upstream bff {
  server stock-bff:4000;
}

server {
  listen 10888;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip (정적 자산 전송량 절감)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA 라우팅 — 없는 경로는 index.html 로 폴백한다.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 실시간 WebSocket — Upgrade 헤더를 넘겨야 한다.
  location /ws {
    proxy_pass http://bff;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 시세 틱이 뜸할 때 idle 로 끊기지 않도록 넉넉히 둔다.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # REST — BFF 프록시.
  location /api {
    proxy_pass http://bff;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
